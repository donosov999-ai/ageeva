name: Deploy Astro to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'   # раз в сутки: тексты тестов берутся из Supabase при сборке — правки из админки доезжают сами

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
      - name: IndexNow — сообщить Яндексу и Bing об обновлении (только при пуше)
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          python3 - <<'PY' > indexnow.json
          import re, json
          urls = re.findall(r"<loc>([^<]+)</loc>", open("public/sitemap.xml", encoding="utf-8").read())
          print(json.dumps({"host": "ageeva.win", "key": "6830e9879b4800798a8e4c0b9366e08a", "keyLocation": "https://ageeva.win/6830e9879b4800798a8e4c0b9366e08a.txt", "urlList": urls}))
          PY
          sleep 45
          curl -sS -m 30 -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow -H "Content-Type: application/json; charset=utf-8" --data @indexnow.json
